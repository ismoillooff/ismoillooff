name: Refresh profile

on:
  schedule:
    - cron: "17 2 * * *" # daily, 07:17 Tashkent time
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: profile-refresh
  cancel-in-progress: false

jobs:
  snake:
    name: Contribution snake
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=#0f766e&color_dots=#ebedf0,#a7f3d0,#5eead4,#14b8a6,#0f766e
            dist/snake-dark.svg?palette=github-dark&color_snake=#2dd4bf&color_dots=#161b22,#134e4a,#0f766e,#14b8a6,#2dd4bf
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cards:
    name: Analytics cards
    runs-on: ubuntu-latest
    env:
      # Needs read access to all of your repositories (private ones included),
      # otherwise the numbers would silently drop to public-only. Without the
      # secret this job leaves the committed cards untouched.
      METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: env.METRICS_TOKEN != ''
      - uses: actions/setup-python@v5
        if: env.METRICS_TOKEN != ''
        with:
          python-version: "3.12"
      - name: Generate cards
        if: env.METRICS_TOKEN != ''
        run: python scripts/generate.py
      - name: Commit changes
        if: env.METRICS_TOKEN != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "Cards are up to date."
          else
            git commit -m "chore: refresh profile analytics"
            git push
          fi
      - name: Skip notice
        if: env.METRICS_TOKEN == ''
        run: echo "::notice::METRICS_TOKEN is not set — analytics cards were not refreshed."
