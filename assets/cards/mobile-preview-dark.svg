<title id="title">Mobile Preview</title>
<desc id="desc">Windows emulator that previews web projects in real iPhone, Galaxy, Pixel and iPad frames — DevTools-protocol emulation, live reload, QR hand-off.</desc>
<style>.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.fade{animation:fadeUp .8s cubic-bezier(.2,.7,.2,1) both}.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.2s cubic-bezier(.2,.7,.2,1) both}.rise{transform-box:fill-box;transform-origin:center bottom;animation:rise .9s cubic-bezier(.2,.7,.2,1) both}.blink{animation:blink 1.1s steps(1) infinite}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes blink{50%{opacity:0}}@keyframes pulse{0%{opacity:.6;transform:scale(1)}75%,100%{opacity:0;transform:scale(2.8)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
