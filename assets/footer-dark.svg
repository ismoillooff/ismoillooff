<svg xmlns="http://www.w3.org/2000/svg" width="880" height="108" viewBox="0 0 880 108" role="img" aria-labelledby="title desc">
<title id="title">Thanks for visiting</title>
<desc id="desc">Animated footer</desc>
<style>.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.fade{animation:fadeUp .8s cubic-bezier(.2,.7,.2,1) both}.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.2s cubic-bezier(.2,.7,.2,1) both}.rise{transform-box:fill-box;transform-origin:center bottom;animation:rise .9s cubic-bezier(.2,.7,.2,1) both}.blink{animation:blink 1.1s steps(1) infinite}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes blink{50%{opacity:0}}@keyframes pulse{0%{opacity:.6;transform:scale(1)}75%,100%{opacity:0;transform:scale(2.8)}}.wave1{animation:w1 7s linear infinite}.wave2{animation:w2 5s linear infinite}@keyframes w1{to{transform:translateX(220px)}}@keyframes w2{to{transform:translateX(160px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
